<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MineControl</title>
<style>
:root{--bg:#0b0b0d;--panel:#151519;--panel2:#1d1d23;--border:#2b2b33;--text:#f6f6f7;--muted:#9898a4;--orange:#ff8a00;--green:#55d88a;--red:#ff6262;--yellow:#e8bd58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--orange);color:#16100a;font-weight:700}button.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}button.danger{background:#3a1e22;color:#ff9292}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:245px;border-right:1px solid var(--border);background:#101012;padding:22px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:22px;font-weight:800;padding:0 12px 22px}.brand b{color:var(--orange)}.nav{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;color:var(--muted);cursor:pointer}.nav:hover,.nav.active{background:var(--panel2);color:var(--text)}.profile{margin-top:auto;border-top:1px solid var(--border);padding:16px 10px;color:var(--muted)}.main{flex:1;padding:28px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}.top h1{margin:0;font-size:28px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:0 8px 30px #0002}.stat strong{font-size:27px;display:block;margin-top:8px}.accent{color:var(--orange)}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.server,.bot{display:flex;flex-direction:column;gap:12px}.server h3,.bot h3{margin:0}.badge{display:inline-flex;width:max-content;padding:4px 8px;border-radius:99px;background:#292930;color:var(--muted);font-size:12px}.badge.online{color:var(--green);background:#153322}.badge.error{color:var(--red);background:#351a1e}.rows{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--border);padding-top:10px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.modal.hidden{display:none}.modalbox{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted)}input,select,textarea{background:#0e0e11;border:1px solid var(--border);border-radius:9px;color:var(--text);padding:11px;width:100%}.tabs{display:flex;gap:7px;overflow:auto;border-bottom:1px solid var(--border);margin-bottom:18px;padding-bottom:8px}.tab{white-space:nowrap;background:transparent;color:var(--muted);padding:9px}.tab.active{color:var(--orange);border-bottom:2px solid var(--orange)}pre.console{background:#09090b;border:1px solid var(--border);border-radius:10px;padding:14px;min-height:300px;max-height:500px;overflow:auto;white-space:pre-wrap}.chat{min-height:280px;max-height:460px;overflow:auto;display:grid;gap:8px}.message{background:var(--panel2);border-radius:9px;padding:9px}.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--border);padding:13px 16px;border-radius:10px;z-index:10}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}.login{max-width:420px;margin:12vh auto}.hidden{display:none!important}@media(max-width:760px){.sidebar{position:fixed;z-index:4;bottom:0;left:0;right:0;width:auto;height:64px;padding:6px;flex-direction:row;border-top:1px solid var(--border);border-right:0;overflow:auto}.brand,.profile{display:none}.nav{padding:9px;white-space:nowrap}.main{padding:20px 14px 85px}.top h1{font-size:22px}}
</style></head>
<body><div id="root"></div><div id="modal" class="modal hidden"><div class="modalbox" id="modalBody"></div></div><div id="toast" class="toast hidden"></div>
<script>
const state={token:localStorage.getItem('minecontrol_token'),user:null,servers:[],server:null,bot:null,tab:'overview',logs:[],chat:[],commands:[],eventSource:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch('/api'+path,{...opts,headers});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||d?.message||`Request failed (${r.status})`);return d}
function toast(s){const el=document.querySelector('#toast');if(!el)return;el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200)}
function modal(html){document.querySelector('#modalBody').innerHTML=html;document.querySelector('#modal').classList.remove('hidden')}function closeModal(){document.querySelector('#modal').classList.add('hidden')}
function render(){if(!state.token){document.querySelector('#root').innerHTML=`<main class="login card"><h1>Mine<span class="accent">Control</span></h1><p class="muted">Multi-server Minecraft control plane</p><form class="form" onsubmit="login(event)"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button><button type="button" class="secondary" onclick="register()">Create account</button></form></main>`;return}document.querySelector('#root').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">Mine<b>Control</b></div><div class="nav active" onclick="home()">▦ Dashboard</div><div class="nav" onclick="serversPage()">◈ Servers</div><div class="nav" onclick="botsPage()">♟ Bots</div><div class="nav" onclick="toast('Automation resources are scoped per bot')">⌁ Automations</div><div class="nav" onclick="toast('Schedules are scoped per bot')">◷ Schedules</div><div class="nav" onclick="toast('Notifications appear from runtime events')">♢ Notifications</div><div class="nav" onclick="toast('Use the selected server or bot settings')">⚙ Settings</div><div class="profile">${esc(state.user?.email||'User')}<br><button class="secondary" style="margin-top:10px" onclick="logout()">Logout</button></div></aside><main class="main" id="view"></main></div>`;home()}
async function login(e){e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});state.token=d.token;localStorage.setItem('minecontrol_token',d.token);state.user=d.user;render();toast('Signed in')}catch(e){toast(e.message)}}
async function register(){const email=prompt('Email');const password=prompt('Password (10+ characters)');if(!email||!password)return;try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({email,password})});state.token=d.token;localStorage.setItem('minecontrol_token',d.token);state.user=d.user;render()}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem('minecontrol_token');state.token=null;render()}
async function load(){try{state.user=await api('/me');state.servers=await api('/servers')}catch(e){state.token=null;localStorage.removeItem('minecontrol_token');render()}}
async function home(){const v=document.querySelector('#view');if(!v)return;try{const d=await api('/dashboard');v.innerHTML=`<div class="top"><div><h1>Dashboard</h1><p class="muted">Live account overview</p></div><button onclick="serverModal()">＋ Add Server</button></div><div class="grid">${[['Servers',d.servers],['Bots',d.bots],['Online',d.onlineBots],['Offline',d.offlineBots],['Errors',d.errors],['Runtimes',d.runtimeCount]].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="toolbar"><h2>Your servers</h2><button class="secondary" onclick="serversPage()">Manage servers</button></div><div class="grid">${state.servers.length?state.servers.map(serverCard).join(''):'<div class="empty">No Servers Yet<br><button style="margin-top:14px" onclick="serverModal()">Add your first server</button></div>'}</div>`}catch(e){v.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function serverCard(s){const online=s.bots.filter(b=>b.status==='ONLINE').length;return `<article class="card server"><h3>${esc(s.name)}</h3><span class="muted">${esc(s.host)}:${s.port}</span><span>${s.edition} · ${esc(s.version||'Auto')}</span><span class="badge ${s.status==='ONLINE'?'online':''}">${s.status}</span><div class="rows"><span>${s.bots.length} bots · ${online} online</span><span>${s.ping??'—'} ms</span></div><div class="actions"><button onclick="serverPage('${s.id}')">Manage</button><button class="secondary" onclick="botModal('${s.id}')">Add Bot</button><button class="secondary" onclick="serverAction('${s.id}','start')">Start All</button><button class="secondary" onclick="serverAction('${s.id}','stop')">Stop All</button><button class="danger" onclick="deleteServer('${s.id}')">Delete</button></div></article>`}
async function serversPage(){await load();document.querySelector('#view').innerHTML=`<div class="top"><div><h1>Servers</h1><p class="muted">Only servers owned by your account are shown.</p></div><button onclick="serverModal()">＋ Add Server</button></div><div class="grid">${state.servers.length?state.servers.map(serverCard).join(''):'<div class="empty">No Servers Yet</div>'}</div>`}
function serverModal(){modal(`<h2>Add Server</h2><form class="form" onsubmit="saveServer(event)"><label>Name<input id="sname" required maxlength="80"></label><label>IP / Domain<input id="shost" required></label><label>Port<input id="sport" type="number" value="25565" min="1" max="65535"></label><label>Edition<select id="sedition"><option value="AUTO">AUTO</option><option value="JAVA">JAVA</option><option value="BEDROCK">BEDROCK</option></select></label><label>Version (optional)<input id="sversion"></label><div class="actions"><button type="button" class="secondary" onclick="testConnection()">Test Connection</button><button>Save Server</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div><p id="testResult" class="muted"></p></form>`)}
async function testConnection(){const out=document.querySelector('#testResult');out.textContent='Testing via server API…';try{const d=await api('/servers/test-connection',{method:'POST',body:JSON.stringify({host:document.querySelector('#shost').value,port:Number(document.querySelector('#sport').value),edition:document.querySelector('#sedition').value,version:document.querySelector('#sversion').value||undefined})});out.textContent=`${d.status||'Online'} · ${d.ping??'—'}ms · ${d.version||'Unknown'} · ${d.edition||document.querySelector('#sedition').value}`}catch(e){out.textContent='Connection failed: '+e.message}}
async function saveServer(e){e.preventDefault();try{await api('/servers',{method:'POST',body:JSON.stringify({name:document.querySelector('#sname').value,host:document.querySelector('#shost').value,port:Number(document.querySelector('#sport').value),edition:document.querySelector('#sedition').value,version:document.querySelector('#sversion').value||undefined})});closeModal();await load();serversPage();toast('Server created')}catch(e){toast(e.message)}}
async function serverAction(id,action){try{await api('/servers/'+id+'/bots/'+action,{method:'POST'});await load();if(state.server&&state.server.id===id){serverPage(id)}else{home()}toast(action+' all requested')}catch(e){toast(e.message)}}
async function deleteServer(id){if(!confirm('Delete this server and its bots?'))return;try{await api('/servers/'+id,{method:'DELETE'});await load();home();toast('Server deleted')}catch(e){toast(e.message)}}
async function serverPage(id){const s=await api('/servers/'+id);state.server=s;document.querySelector('#view').innerHTML=`<div class="top"><div><h1>${esc(s.name)}</h1><p class="muted">${esc(s.host)}:${s.port} · ${s.edition} · ${esc(s.version||'Auto')}</p></div><div class="actions"><button onclick="botModal('${s.id}')">＋ Add Bot</button><button class="secondary" onclick="serverAction('${s.id}','start')">Start All</button><button class="secondary" onclick="serverAction('${s.id}','stop')">Stop All</button></div></div><div class="grid">${s.bots.length?s.bots.map(botCard).join(''):'<div class="empty">No Bots Yet</div>'}</div>`}
function botCard(b){return `<article class="card bot"><h3>${esc(b.name)}</h3><span class="muted">${esc(b.username)}</span><span class="badge ${b.status==='ONLINE'?'online':b.status==='ERROR'?'error':''}">${b.status}</span><div class="rows"><span>${b.ping??'—'} ms</span><span>Reconnects: ${b.reconnectCount}</span></div>${b.lastError?`<small class="red">${esc(b.lastError)}</small>`:''}<div class="actions"><button onclick="botAction('${b.id}','start')">Start</button><button class="secondary" onclick="botAction('${b.id}','stop')">Stop</button><button class="secondary" onclick="botAction('${b.id}','restart')">Restart</button><button class="secondary" onclick="botPage('${state.server.id}','${b.id}')">Open</button></div></article>`}
async function botsPage(){await load();const all=state.servers.flatMap(s=>s.bots.map(b=>({...b,serverName:s.name,serverId:s.id})));document.querySelector('#view').innerHTML=`<div class="top"><div><h1>Bots</h1><p class="muted">Every runtime is isolated by bot.</p></div></div><div class="grid">${all.length?all.map(b=>`<article class="card bot"><h3>${esc(b.name)}</h3><span>${esc(b.serverName)} · ${esc(b.username)}</span><span class="badge ${b.status==='ONLINE'?'online':''}">${b.status}</span><button onclick="botPage('${b.serverId}','${b.id}')">Open bot</button></article>`).join(''):'<div class="empty">No Bots Yet</div>'}</div>`}
function botModal(serverId){modal(`<h2>Add Bot</h2><form class="form" onsubmit="saveBot(event,'${serverId}')"><label>Name<input id="bname" required></label><label>Minecraft username<input id="buser" required></label><label>Version<input id="bversion"></label><label>Authentication<select id="bauth"><option value="offline">Offline</option><option value="microsoft">Microsoft</option><option value="login-plugin">Login Plugin</option><option value="custom">Custom</option></select></label><label>Max retries<input id="bretries" type="number" value="10"></label><label>Reconnect delay (ms)<input id="bdelay" type="number" value="5000"></label><label><input id="bauto" type="checkbox" checked> Auto reconnect</label><div class="actions"><button>Create Bot</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`)}
async function saveBot(e,id){e.preventDefault();try{await api('/servers/'+id+'/bots',{method:'POST',body:JSON.stringify({name:document.querySelector('#bname').value,username:document.querySelector('#buser').value,minecraftVersion:document.querySelector('#bversion').value||undefined,autoReconnect:document.querySelector('#bauto').checked,maxRetries:Number(document.querySelector('#bretries').value),reconnectDelay:Number(document.querySelector('#bdelay').value),settings:{auth:document.querySelector('#bauth').value}})});closeModal();serverPage(id);toast('Bot created')}catch(e){toast(e.message)}}
async function botAction(id,a){try{await api('/bots/'+id+'/'+a,{method:'POST'});toast(a+' requested');await load();if(state.server)serverPage(state.server.id)}catch(e){toast(e.message)}}
async function botPage(serverId,id){state.server=await api('/servers/'+serverId);state.bot=await api('/bots/'+id);state.tab='overview';renderBot()} 
async function renderBot(){const b=state.bot,s=state.server;document.querySelector('#view').innerHTML=`<div class="top"><div><h1>${esc(b.name)}</h1><p class="muted">${esc(b.username)} · ${esc(s.name)} · ${esc(s.host)}:${s.port}</p></div><div class="actions"><button onclick="botAction('${b.id}','start')">Start</button><button class="secondary" onclick="botAction('${b.id}','stop')">Stop</button><button class="secondary" onclick="botAction('${b.id}','restart')">Restart</button></div></div><div class="tabs">${['overview','console','chat','commands','authentication','automation','workflow','schedule','players','monitoring','logs','notifications','backups','settings'].map(t=>`<button class="tab ${state.tab===t?'active':''}" onclick="botTab('${t}')">${t}</button>`).join('')}</div><section id="botContent"></section>`;await botTab(state.tab)}
async function botTab(t){state.tab=t;const c=document.querySelector('#botContent');if(!c)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.textContent.toLowerCase()===t));if(t==='overview'){const b=state.bot,s=state.server;c.innerHTML=`<div class="grid"><div class="card"><span class="muted">Status</span><h2 class="${b.status==='ONLINE'?'green':''}">${b.status}</h2></div><div class="card"><span class="muted">Server</span><h2>${esc(s.name)}</h2><span>${esc(s.host)}:${s.port}</span></div><div class="card"><span class="muted">Ping</span><h2>${b.ping??'—'} ms</h2></div><div class="card"><span class="muted">Reconnects</span><h2>${b.reconnectCount}</h2></div></div><div class="card" style="margin-top:14px"><p>Version: ${esc(b.minecraftVersion||s.version||'Auto')} · Edition: ${b.edition}</p><p>Last online: ${b.lastOnlineAt||'—'}</p><p class="red">${esc(b.lastError||'No errors')}</p></div>`}else if(t==='console'||t==='logs'){await loadLogs();c.innerHTML=`<div class="toolbar"><input id="logSearch" placeholder="Search logs" oninput="filterLogs()"><div class="actions"><select id="logLevel" onchange="filterLogs()"><option value="">All levels</option>${['INFO','WARNING','ERROR','CONNECTION','COMMAND','AUTH','AUTOMATION','SYSTEM'].map(x=>`<option>${x}</option>`).join('')}</select><button class="secondary" onclick="downloadLogs()">Download</button><button class="secondary" onclick="clearConsole()">Clear view</button></div></div><pre class="console" id="console">${state.logs.map(logLine).join('\n')||'No log entries yet.'}</pre>`}else if(t==='chat'){await loadChat();c.innerHTML=`<div class="card"><div class="chat" id="chat">${state.chat.map(x=>`<div class="message"><b>${esc(x.player)}</b> <span class="muted">${new Date(x.createdAt).toLocaleString()}</span><br>${esc(x.message)}</div>`).join('')||'<div class="empty">No chat messages yet.</div>'}</div><form class="actions" style="margin-top:14px" onsubmit="sendChat(event)"><input id="chatInput" placeholder="Message…" maxlength="256" required><button>Send</button></form></div>`}else if(t==='commands'){await loadCommands();c.innerHTML=`<div class="card"><form class="actions" onsubmit="runCommand(event)"><input id="cmdInput" placeholder="/spawn" required maxlength="256"><button>Run</button></form><div style="margin-top:15px">${state.commands.map(x=>`<div class="rows"><code>${esc(x.command)}</code><span>${esc(x.status)} · ${esc(x.result||'')} · ${new Date(x.createdAt).toLocaleString()}</span></div>`).join('')||'<div class="empty">No commands yet.</div>'}</div></div>`}else{c.innerHTML=`<div class="card"><h2>${t[0].toUpperCase()+t.slice(1)}</h2><p class="muted">This view is scoped to bot ${esc(state.bot.id)}. It uses persisted backend data; management endpoints for this resource are not exposed by the current API yet.</p></div>`}}
function logLine(x){return `[${new Date(x.createdAt).toLocaleString()}] [${x.level}] ${x.message}`}async function loadLogs(){state.logs=await api('/bots/'+state.bot.id+'/logs')}async function loadChat(){state.chat=await api('/bots/'+state.bot.id+'/chat')}async function loadCommands(){state.commands=await api('/bots/'+state.bot.id+'/commands')}function filterLogs(){const q=(document.querySelector('#logSearch')?.value||'').toLowerCase(),l=document.querySelector('#logLevel')?.value;document.querySelector('#console').textContent=state.logs.filter(x=>(!q||logLine(x).toLowerCase().includes(q))&&(!l||x.level===l)).map(logLine).join('\n')||'No matching logs.'}function downloadLogs(){const blob=new Blob([state.logs.map(logLine).join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.bot.name}-logs.txt`;a.click();URL.revokeObjectURL(a.href)}function clearConsole(){document.querySelector('#console').textContent=''}async function sendChat(e){e.preventDefault();try{await api('/bots/'+state.bot.id+'/chat',{method:'POST',body:JSON.stringify({message:document.querySelector('#chatInput').value})});document.querySelector('#chatInput').value='';await botTab('chat');toast('Message sent')}catch(e){toast(e.message)}}async function runCommand(e){e.preventDefault();try{await api('/bots/'+state.bot.id+'/commands',{method:'POST',body:JSON.stringify({command:document.querySelector('#cmdInput').value})});await botTab('commands');toast('Command sent')}catch(e){toast(e.message)}}
async function stream(){if(!state.token)return;try{const r=await fetch('/api/events',{headers:{Authorization:'Bearer '+state.token}});if(!r.body)return;const reader=r.body.getReader(),dec=new TextDecoder();while(true){const {done,value}=await reader.read();if(done)break;const text=dec.decode(value);if(text.includes('data:')){await load();if(state.server&&state.bot){state.server=await api('/servers/'+state.server.id);state.bot=await api('/bots/'+state.bot.id);if(document.querySelector('#botContent'))await botTab(state.tab)}}} }catch(e){console.warn('Event stream idle',e)}}
load().then(render);stream();
</script></body></html>
