<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MineControl</title><style>body{margin:0;background:#0d0d0f;color:#f5f5f5;font:15px system-ui}main{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#18181b;border:1px solid #29292e;border-radius:16px;padding:20px}.accent{color:#ff8a00}button{background:#ff8a00;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}input{background:#111113;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;margin:4px}.row{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#999}.online{color:#52d273}.error{color:#ff6868}</style></head><body><main><h1>Mine<span class="accent">Control</span></h1><p class="muted">Multi-server Minecraft bot control plane</p><section class="grid" id="stats"></section><div class="row"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button></div><section id="servers" class="grid" style="margin-top:24px"></section></main><script>let token=localStorage.token;const api=(p,o={})=>fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}}).then(r=>r.json());async function login(){const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});if(d.token){token=d.token;localStorage.token=token;load()}else alert(d.error||'Login failed')}async function load(){if(!token)return;const s=await api('/dashboard');stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class=card><b>${k}</b><h2>${v}</h2></div>`).join('');const list=await api('/servers');servers.innerHTML=list.map(x=>`<div class=card><h2>${x.name}</h2><p>${x.host}:${x.port}</p><p>${x.edition} · ${x.status}</p><p>${x.bots.length} bots</p><p>${x.bots.map(b=>`<span class=${b.status==='ONLINE'?'online':''}>● ${b.name} (${b.status})</span>`).join('<br>')}</p></div>`).join('')||'<div class=card>No servers yet</div>'}load();new EventSource('/api/events').onmessage=e=>load();</script></body></html>
